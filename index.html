<!DOCTYPE html>

    <style>
        @font-face {
            font-family: 'LicensePlate';
            src: url('LicensePlate-j9eO.ttf') format('truetype');
        }

        /* Basis instellingen voor het hele scherm */
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* SCHERMVAK 1: Fullscreen header video (ongewijzigd) */
        header {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        header video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            font-family: 'LicensePlate', sans-serif;
            color: black;
            z-index: 2;
            pointer-events: none;
        }

        .scroll-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 1rem;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            z-index: 3;
            transition: background-color 0.3s ease;
        }

        .scroll-button:hover {
            background-color: #e0e0e0;
        }

      
        }
    </style>
</head>
