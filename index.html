<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>portfolio van Bert</title>
    <style>
        @font-face {
            font-family: 'LicensePlate';
            src: url('LicensePlate-j9eO.ttf') format('truetype');
        }

        /* Basis instellingen voor het hele scherm */
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* SCHERMVAK 1: Fullscreen header video (ongewijzigd) */
        header {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        header video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            font-family: 'LicensePlate', sans-serif;
            color: black;
            z-index: 2;
            pointer-events: none;
        }

        .scroll-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 1rem;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            z-index: 3;
            transition: background-color 0.3s ease;
        }

        .scroll-button:hover {
            background-color: #e0e0e0;
        }

        /* SCHERMVAK 2: Volledig scherm onder de header */
        .content-section {
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            background: black;
        }

        /* Sectie titel */
        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Horizontaal scrollbare container voor video's */
        .video-scroll-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-snap-type: x mandatory;
            /* Verberg standaard scrollbar voor strakke look (optioneel) */
            -webkit-overflow-scrolling: touch;
        }

        /* Styling van de video scrollbar */
        .video-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .video-scroll-container::-webkit-scrollbar-track {
            background: #111;
        }
        .video-scroll-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        /* Elke video container in de rij */
        .youtube-video-card {
            flex: 0 0 450px; /* Vaste breedte per video */
            scroll-snap-align: start;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Zorgt voor de juiste 16:9 verhouding van de video */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tekstvak onderaan het scherm */
        .description-box {
            max-width: 800px;
            margin: 20px auto 0 auto;
            text-align: center;
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .description-box p {
            margin: 0;
            line-height: 1.6;
            color: #ccc;
            font-size: 1.1rem;
        }

        /* Mobiele optimalisatie */
        @media (max-width: 768px) {
            .overlay-text {
                font-size: 10vw;
            }

            .scroll-button {
                font-size: 1.5rem;
                padding: 10px 20px;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .youtube-video-card {
                flex: 0 0 85vw; /* Video's vullen bijna het hele scherm op mobiel */
            }

            .content-section {
                height: auto; /* Op mobiel mag het meescrollen als het scherm te klein is */
                padding: 40px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- SCHERMVAK 1: Fullscreen video -->
    <header>
        <video autoplay muted loop playsinline preload="auto">
            <source src="header.mp4" type="video/mp4">
            Je browser ondersteunt geen HTML5 video.
        </video>
        <div class="overlay-text">Bert Van Riet</div>
        <button class="scroll-button" onclick="scrollToSection()">↓</button>
    </header>

    <!-- SCHERMVAK 2: School opdrachten -->
    <div class="content-section" id="school-section">
        
        <h2 class="section-title">School opdrachten</h2>
      <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/site/Gtn9cBUgPxGBpFJGwNhSeI/PORTFOLIO-BERT-3-9?node-id=1-366&embed-host=share" allowfullscreen></iframe>  
    }
    </script>
  
</body>
</html>
